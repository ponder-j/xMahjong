[project]
name = "xmahjong"
version = "0.1.0"
description = "Evidence-grounded multi-engine riichi replay review"
requires-python = ">=3.12,<3.14"
dependencies = [
    "fastapi>=0.115,<1",
    "uvicorn>=0.34,<1",
    "httpx>=0.28,<1",
    "mahjong>=1.3,<2",
    "pydantic-settings>=2.7,<3",
    "python-multipart>=0.0.20",
    "tensoul==0.1.8",
    "unitypy>=1.25.4,<1.26",
]

[dependency-groups]
dev = ["pytest>=8,<10", "pytest-asyncio>=0.25", "ruff>=0.11"]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
pythonpath = ["backend"]

[tool.ruff]
line-length = 110
